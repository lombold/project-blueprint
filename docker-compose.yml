services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm --hostname-strict=false --hostname-backchannel-dynamic=false
    ports:
      - "8082:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/project-name-realm.json:/opt/keycloak/data/import/project-name-realm.json:ro
    networks:
      - project-name-network

networks:
  project-name-network:
    driver: bridge

# Usage:
# - Run the backend from backend/ with:
#     mvn spring-boot:run -Dspring-boot.run.profiles=local
# - Spring Boot Docker Compose starts Keycloak automatically.
# - Run the web frontend and Ionic app separately with `bun run start`.
