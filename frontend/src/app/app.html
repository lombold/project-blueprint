<nav class="sticky top-0 z-50 bg-indigo-600 text-white shadow-lg">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <a routerLink="/users" class="text-2xl font-bold">ProjectName</a>
    <ul class="flex gap-8 items-center">
      <li>
        <a routerLink="/users" class="hover:text-indigo-200 transition-colors"
          >Users</a
        >
      </li>
    </ul>
    <div
      class="relative"
      appClickOutside
      (clickedOutside)="closeProfileMenu()"
      (escapePressed)="closeProfileMenu()"
    >
      <button
        type="button"
        data-testid="profile-menu-button"
        class="inline-flex h-10 items-center gap-2 rounded-md border border-white/20 px-3 text-sm font-medium transition-colors hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
        [attr.aria-expanded]="profileMenuOpen()"
        aria-haspopup="menu"
        (click)="toggleProfileMenu()"
      >
        <span
          class="flex h-7 w-7 items-center justify-center rounded-full bg-indigo-800"
        >
          <svg lucideUserRound size="16" aria-hidden="true"></svg>
        </span>
        <span class="max-w-32 truncate">{{ displayName() }}</span>
        <svg lucideChevronDown size="16" aria-hidden="true"></svg>
      </button>

      @if (profileMenuOpen()) {
      <div
        class="absolute right-0 mt-2 w-56 rounded-md border border-zinc-200 bg-white py-2 text-zinc-950 shadow-xl"
        role="menu"
      >
        <div class="border-b border-zinc-100 px-4 pb-2 pt-1 text-sm">
          <p class="font-medium">{{ displayName() }}</p>
          <p class="text-xs text-zinc-500">Signed in</p>
        </div>
        <button
          type="button"
          data-testid="logout-button"
          class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-red-700 transition-colors hover:bg-red-50"
          role="menuitem"
          (click)="logout()"
        >
          <svg lucideLogOut size="16" aria-hidden="true"></svg>
          Log out
        </button>
      </div>
      }
    </div>
  </div>
</nav>

<router-outlet />
