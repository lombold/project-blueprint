spring:
  application:
    name: project-name
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/incremental
    validate-on-migrate: true
    clean-disabled: true
  h2:
    console:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8082/realms/project-name}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:8100
      - capacitor://localhost
      - https://localhost

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration/current
    clean-disabled: false
