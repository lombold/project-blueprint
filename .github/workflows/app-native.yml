name: Build Native App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    name: Build Android Debug App

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Build and sync Android
        working-directory: ./app
        run: bun run build && bunx cap sync android

      - name: Assemble debug APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug

  ios:
    runs-on: macos-latest
    name: Build iOS Simulator App

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Build and sync iOS
        working-directory: ./app
        run: bun run build && bunx cap sync ios

      - name: Build unsigned simulator app
        run: >-
          xcodebuild
          -project app/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
