name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    name: Test Backend (Java, Maven)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      
      # Fails fast with a clear signal; `verify` also runs this via the validate phase.
      - name: Check backend formatting
        working-directory: ./backend
        run: mvn spotless:check

      - name: Build and test backend
        working-directory: ./backend
        run: mvn clean verify

      - name: Check generated Angular clients
        run: git diff --exit-code -- frontend/src/app/core/api app/src/app/core/api
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports

  test-frontend:
    runs-on: ubuntu-latest
    name: Test Frontend (Angular, Vitest)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile
      
      - name: Run linter
        working-directory: ./frontend
        run: bun run lint

      - name: Check dependencies
        working-directory: ./frontend
        run: bun run depcruise
      
      - name: Run tests
        working-directory: ./frontend
        run: bun run test:ci

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
      
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  test-app:
    runs-on: ubuntu-latest
    name: Test App (Ionic, Angular, Capacitor)
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      
      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile
      
      - name: Run linter
        working-directory: ./app
        run: bun run lint
      
      - name: Check dependencies
        working-directory: ./app
        run: bun run depcruise

      - name: Run tests
        working-directory: ./app
        run: bun run test:ci

      - name: Build and sync native projects
        working-directory: ./app
        run: bun run sync:prod

      - name: Verify Capacitor web entry point
        run: test -f app/www/index.html

      - name: Check native synchronization
        run: git diff --exit-code -- app/android app/ios

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: app/coverage
